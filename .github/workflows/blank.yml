name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android- und iPhone-Dateien erzeugen
        run: flutter create --project-name papiertiger --org de.papiertiger --platforms android,ios .

      - run: flutter pub get

      - name: Pruefung (Tests)
        run: flutter test

      - name: APK bauen
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: papiertiger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
